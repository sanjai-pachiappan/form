<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
  </head>
  <body>
    <form>
      <center>
        <h1>Create your Account</h1>
        <br />
        <p>Sign up to get started</p>
        <br />
        <label for="Full name">Full Name:</label> <br />
        <br />
        <input type="text" placeholder="  Enter your full name" /><br />
        <br />
        <label for="email">Email:</label><br />
        <input type="email" placeholder="Enter your email" /><br />
        <br />
        <label for="password">Password:</label><br />
        <input type="text" placeholder="Create a password" /><br />
        <p>At least 8 characters</p>
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to the Terms and Conditions</label><br />
        <br />
        <button type="submit">Sign UP</button><br />
        <p>or</p>
        <button type="continue with google">Continue With Google</button><br />

        <br />
        Already have an account? <a href="form.html">Login here</a><br />
      </center>
    </form>
  </body>
</html>
